name: Vanu
description: 'Vanu, Inc. builds wireless network solutions that extend cellular coverage
  to areas that cannot be profitably served with conventional technology - rural regions,
  buildings, tunnels, and maritime environments. Founded in 1998 out of MIT software-radio
  research and headquartered in Lexington, MA (with offices in Gurgaon, Bangalore,
  and Kigali), Vanu ships the Anywave dual-mode GSM/LTE base station (the first FCC-certified
  software-defined radio), Community Connect village systems, portable LTE networks,
  VanuMaps coverage mapping, and coverage-as-a-service for mobile carriers, with deployments
  across rural India, Rwanda, and post-hurricane Puerto Rico and partnerships with
  Amazon Leo / Project Kuiper. Vanu publishes no public developer API surface.'
